<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Moy AI" fill="none">
  <defs>
    <linearGradient id="moyGrad" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B3DFF"/>
      <stop offset="1" stop-color="#6A28D9"/>
    </linearGradient>
    <linearGradient id="moyGradSoft" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B56CFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
  </defs>

  <!-- Antena -->
  <line x1="32" y1="9" x2="32" y2="15" stroke="url(#moyGradSoft)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="32" cy="6.4" r="3.4" fill="#B56CFF"/>

  <!-- Kepala robot-pin: balok membulat dengan bawah runcing seperti pin peta -->
  <path d="M32 58 C 24.5 49.5, 12 40.2, 12 27.5 C 12 18.4 20.9 12.4 32 12.4 C 43.1 12.4 52 18.4 52 27.5 C 52 40.2 39.5 49.5 32 58 Z"
        fill="url(#moyGrad)"/>

  <!-- Wajah: panel terang agar terbaca di kedua mode -->
  <rect x="19" y="21.5" width="26" height="17.5" rx="8.4" fill="#F8F5FF" opacity="0.96"/>

  <!-- Mata -->
  <circle cx="26.4" cy="30.2" r="3.1" fill="#4C159B"/>
  <circle cx="37.6" cy="30.2" r="3.1" fill="#4C159B"/>
  <!-- Senyum -->
  <path d="M27.6 35.4 C 29.4 37.3 34.6 37.3 36.4 35.4" stroke="#4C159B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Kilau kecil -->
  <circle cx="47.5" cy="18.5" r="1.9" fill="#D9C2FF"/>
  <circle cx="15.5" cy="21.5" r="1.3" fill="#D9C2FF" opacity=".8"/>
</svg>
